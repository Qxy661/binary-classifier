[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binary-classifier"
version = "0.1.0"
description = "Fun binary classifier: cat vs dog / milk-dragon vs taffy, with MiniTorch and PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Qxy661" }]
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "torch>=2.6",
    "torchvision>=0.21",
    "matplotlib>=3.8",
]

[tool.setuptools]
packages = { find = { include = ["scripts"] } }
